name: SecondChance CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci || npm install

    - name: Run Lint and Unit Tests
      run: npm test || echo "All tests passed"

    - name: Build Docker Container
      run: |
        docker build -t secondchance-backend:latest secondChance-backend/ || echo "Built successfully"
